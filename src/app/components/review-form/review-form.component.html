<div class="review-form">
  <h3 *ngIf="isEditing" class="form-title">Edit Review</h3>
  <h3 *ngIf="!isEditing" class="form-title">Create New Review</h3>
  
  <form [formGroup]="form" (ngSubmit)="submit()" enctype="multipart/form-data">
    <div class="field">
      <label for="prompt">Prompt</label>
      <textarea id="prompt" formControlName="prompt" rows="3"></textarea>
    </div>
    <div class="field">
      <label for="review">Review</label>
      <textarea id="review" formControlName="review" rows="3"></textarea>
    </div>

    <!-- Existing Images Section (only shown when editing) -->
    <div class="field" *ngIf="isEditing && existingImages.length > 0">
      <label>Current Images</label>
      <div class="existing-images">
        <div class="image-item" *ngFor="let img of existingImages" [class.marked-for-removal]="imagesToRemove.has(img)">
          <img [src]="existingImageUrls[img]" [alt]="img" class="image-thumbnail">
          <div class="image-info">
            <span class="image-name">{{ img }}</span>
            <button type="button" 
              class="btn-remove-image" 
              (click)="removeExistingImage(img)"
              *ngIf="!imagesToRemove.has(img)"
              title="Remove this image">
              ✕
            </button>
            <button type="button" 
              class="btn-restore-image" 
              (click)="restoreExistingImage(img)"
              *ngIf="imagesToRemove.has(img)"
              title="Restore this image">
              ↻
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- New Images Section -->
    <div class="field">
      <label for="images">
        {{ isEditing ? 'Add Additional Images' : 'Upload Images' }}
        <span *ngIf="isEditing" class="optional-text">(optional)</span>
      </label>
      <input id="images" type="file" (change)="onFileChange($event)" multiple accept="image/*">
      <div class="new-images" *ngIf="imageFiles.length > 0">
        <div class="image-item" *ngFor="let file of imageFiles; let i = index">
          <div class="image-info">
            <span class="image-name">{{ file.name }}</span>
            <button type="button" 
              class="btn-remove-image" 
              (click)="removeNewImage(i)"
              title="Remove this image">
              ✕
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="ratings">
      <div class="rating" *ngFor="let field of ['handFeet','facialExpression','genital','accessories','sideCharacter','background']">
        <label [for]="field">{{ field }}</label>
        <select [id]="field" [formControlName]="field">
          <option value="">Select…</option>
          <option *ngFor="let r of ratingOptions" [value]="r">{{ r }}</option>
        </select>
      </div>
    </div>
    <div class="button-group">
      <button type="submit" [disabled]="form.invalid || (imageFiles.length === 0 && !isEditing)">
        {{ isEditing ? 'Update Review' : 'Create Review' }}
      </button>
      <button type="button" *ngIf="isEditing" (click)="clearEditing()" class="btn-cancel">Cancel</button>
    </div>
  </form>
</div>
