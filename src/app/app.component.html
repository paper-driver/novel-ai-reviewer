<div class="container">
  <h1>Novel AI Image Review</h1>
  
  <!-- Floating Stats Widget -->
  <app-floating-stats></app-floating-stats>
  
  <!-- Navigation Tabs -->
  <div class="nav-tabs">
    <button 
      class="tab-button" 
      [class.active]="currentTab === 'reviews'"
      (click)="currentTab = 'reviews'">
      Reviews
    </button>
    <button 
      class="tab-button" 
      [class.active]="currentTab === 'grouping'"
      (click)="currentTab = 'grouping'">
      Artist Grouping Tool
    </button>
    <button 
      class="tab-button" 
      [class.active]="currentTab === 'gallery'"
      (click)="currentTab = 'gallery'">
      Artist Gallery
    </button>
    <button 
      class="tab-button" 
      [class.active]="currentTab === 'prompt-grouping'"
      (click)="currentTab = 'prompt-grouping'">
      Prompt-Based Grouping
    </button>
  </div>

  <!-- Reviews Section -->
  <div *ngIf="currentTab === 'reviews'" class="reviews-section">
    <app-review-form 
      [editingReview]="editingReview"
      (reviewCreated)="onReviewChange()"
      (reviewUpdated)="onReviewChange()"
    ></app-review-form>
    <app-filter-panel (filtersChanged)="onFiltersChange($event)"></app-filter-panel>
    <app-reviews-table 
      [filters]="filters"
      (editReview)="onEditReview($event)"
    ></app-reviews-table>
  </div>

  <!-- Artist Grouping Section -->
  <div *ngIf="currentTab === 'grouping'" class="grouping-section">
    <app-artist-grouping></app-artist-grouping>
  </div>

  <!-- Artist Gallery Section -->
  <div *ngIf="currentTab === 'gallery'" class="gallery-section">
    <app-artist-gallery></app-artist-gallery>
  </div>

  <!-- Prompt-Based Grouping Section -->
  <div *ngIf="currentTab === 'prompt-grouping'" class="prompt-grouping-section">
    <app-prompt-grouping></app-prompt-grouping>
  </div>
</div>
