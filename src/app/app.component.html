<div class="container">
  <h1>Novel AI Image Review</h1>
  
  <!-- Floating Stats Widget -->
  <app-floating-stats></app-floating-stats>

  <!-- Floating Navigation Bar -->
  <app-floating-nav 
    [currentTab]="currentTab"
    (tabChanged)="onTabChange($event)">
  </app-floating-nav>
  
  <!-- Navigation Tabs -->
  <div class="nav-tabs">
    <button 
      class="tab-button" 
      [class.active]="currentTab === 'reviews-management'"
      (click)="currentTab = 'reviews-management'">
      📊 Review Manager
    </button>
    <button 
      class="tab-button" 
      [class.active]="currentTab === 'grouping'"
      (click)="currentTab = 'grouping'">
      Artist Grouping Tool
    </button>
    <button 
      class="tab-button" 
      [class.active]="currentTab === 'gallery'"
      (click)="currentTab = 'gallery'">
      Artist Gallery
    </button>
    <button 
      class="tab-button" 
      [class.active]="currentTab === 'prompt-grouping'"
      (click)="currentTab = 'prompt-grouping'">
      Prompt-Based Grouping
    </button>
    <button 
      class="tab-button" 
      [class.active]="currentTab === 'artist-registry'"
      (click)="currentTab = 'artist-registry'">
      🎨 Artist Registry
    </button>
    <button 
      class="tab-button" 
      [class.active]="currentTab === 'combination-generator'"
      (click)="currentTab = 'combination-generator'">
      ✨ Combination Generator
    </button>
  </div>

  <!-- Reviews Management Section (Folder-Based) -->
  <div *ngIf="currentTab === 'reviews-management'" class="reviews-management-section">
    <app-reviews-management [reviewRequest]="pendingReviewRequest"></app-reviews-management>
  </div>

  <!-- Artist Grouping Section -->
  <div *ngIf="currentTab === 'grouping'" class="grouping-section">
    <app-artist-grouping></app-artist-grouping>
  </div>

  <!-- Artist Gallery Section -->
  <div *ngIf="currentTab === 'gallery'" class="gallery-section">
    <app-artist-gallery></app-artist-gallery>
  </div>

  <!-- Prompt-Based Grouping Section -->
  <div *ngIf="currentTab === 'prompt-grouping'" class="prompt-grouping-section">
    <app-prompt-grouping></app-prompt-grouping>
  </div>

  <!-- Artist Registry Section -->
  <div *ngIf="currentTab === 'artist-registry'" class="artist-registry-section">
    <app-artist-registry></app-artist-registry>
  </div>

  <!-- Combination Generator Section -->
  <div *ngIf="currentTab === 'combination-generator'" class="combination-generator-section">
    <app-combination-generator></app-combination-generator>
  </div>
</div>
